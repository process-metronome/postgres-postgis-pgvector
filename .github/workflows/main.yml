name: build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: processmetronome/postgres-postgis-pgvector

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: '16'
            postgis: '3.6'
          - pg: '17'
            postgis: '3.6'
          - pg: '18'
            postgis: '3.6'
    env:
      VARIANT: ${{ matrix.pg }}-${{ matrix.postgis }}
      CI_TAG: ci-${{ matrix.pg }}-${{ matrix.postgis }}-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "processmetronome/postgres"

      # Pushed under a throwaway tag first: the public tags only move once the image has passed the smoke test.
      # Pull requests build and load the image locally instead of pushing it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            POSTGIS=${{ matrix.postgis }}
          # A multi-platform build cannot be loaded for the PR smoke test; add linux/arm64 with a separate publish step if needed.
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.CI_TAG }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}

      - name: Smoke test
        id: smoke
        run: |
          bash tests/smoke.sh "$IMAGE:$CI_TAG"
          docker run -d --name pg -e POSTGRES_PASSWORD=test "$IMAGE:$CI_TAG"
          for i in $(seq 1 60); do
            [ "$(docker logs pg 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break
            sleep 2
          done
          PGVECTOR=$(docker exec pg psql -U postgres -tAc "select extversion from pg_extension where extname = 'vector'")
          docker rm -f pg
          test -n "$PGVECTOR"
          echo "pgvector=$PGVECTOR" >> "$GITHUB_OUTPUT"

      # <pg> floats to the newest PostGIS/pgvector in the matrix (one PostGIS series per PG major today).
      - name: Publish tags
        if: env.PUBLISH == 'true'
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ matrix.pg }}" \
            --tag "$IMAGE:$VARIANT" \
            --tag "$IMAGE:$VARIANT-${{ steps.smoke.outputs.pgvector }}" \
            "$IMAGE:$CI_TAG"
